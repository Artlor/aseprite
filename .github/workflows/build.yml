name: build-aseprite
on: [push, pull_request, workflow_dispatch]

jobs:
  build-windows:
    runs-on: windows-latest
        
    steps:
    - name: Checkout Aseprite
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Cache Skia
      id: cache-skia
      uses: actions/cache@v4
      with:
        path: skia
        key: skia-${{ hashFiles('laf/misc/skia-url.sh') }}

    - name: Get Skia (Smart Versioning)
      if: steps.cache-skia.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $skia_url = bash laf/misc/skia-url.sh
        Write-Host "Downloading Skia from: $skia_url"
        Invoke-WebRequest -Uri $skia_url -OutFile skia.zip
        Expand-Archive -Path skia.zip -DestinationPath skia -Force
        
    - name: Install Ninja
      shell: pwsh
      run: choco install ninja --confirm
    
    - name: Setup MSVC (Force x64)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    
    - name: Generate Makefiles
      shell: pwsh
      run: |
        cmake -S . -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DENABLE_TESTS=OFF `
          -DENABLE_SCRIPTING=ON `
          -DENABLE_UPDATER=OFF `
          -DENABLE_OPENSSL=OFF `
          -DLAF_BACKEND=skia `
          -DSKIA_DIR="$PWD\skia" `
          -DSKIA_LIBRARY_DIR="$PWD\skia\out\Release-x64" `
          -DSKIA_LIBRARY="$PWD\skia\out\Release-x64\skia.lib"
          
    - name: Compile Aseprite
      shell: pwsh
      run: |
        Set-Location build
        ninja aseprite
        if (-not (Test-Path "bin/aseprite.exe")) {
          Write-Error "Compilation failed - aseprite.exe not found!"
          exit 1
        }
        Write-Host "✓ Build successful - aseprite.exe created"
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aseprite-Windows-Release
        path: |
          build/bin/aseprite.exe
          build/bin/data/
        if-no-files-found: error
        compression-level: 6
